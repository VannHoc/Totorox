name: Tororox CI - Test & Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Unit Tests & Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project from project.yml
        run: |
          xcodegen generate

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tororox.xcodeproj \
            -scheme TororoxTests \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Application Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project Tororox.xcodeproj \
            -scheme Tororox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tororox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Tororox.xcarchive/Products/Applications/Tororox.app build/ipa/Payload/
          cd build/ipa
          zip -r -9 ../../Tororox-1.0-unsigned.ipa Payload
          cd ../..
          ls -lh Tororox-1.0-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tororox-1.0-unsigned-ipa
          path: Tororox-1.0-unsigned.ipa
          if-no-files-found: error

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
